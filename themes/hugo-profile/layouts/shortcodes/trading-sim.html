<div style="background-color: #1a1a1a; color: white; padding: 20px; border-radius: 10px; border: 1px solid #58C4DD; font-family: 'Courier New', Courier, monospace;">
    <h3 style="color: #58C4DD; text-align: center;">Terminal de Ejecución: BTC/USDT</h3>
    
    <!-- Resumen de Cuenta -->
    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; background: #252525; padding: 15px; border-radius: 5px;">
        <div>Efectivo: <span id="balance-mxn" style="color: #50FA7B;">$25,000.00</span></div>
        <div>Invertido: <span id="invested-mxn" style="color: #58C4DD;">$0.00</span></div>
        <div>Comisiones: <span id="fees-mxn" style="color: #FF5555;">$0.00</span></div>
        <div>P&L Realizado: <span id="total-pnl" style="font-weight: bold;">$0.00</span></div>
    </div>

    <!-- Panel de Control Simplificado -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center; justify-content: center;">
        <span style="color: #58C4DD; font-weight: bold;">Monto MXN:</span>
        <input type="number" id="trade-amount" value="5000" style="width: 120px; background: #333; border: 1px solid #58C4DD; color: white; padding: 8px; border-radius: 4px;">
        <button onclick="executeTrade('BUY')" style="background: #50FA7B; color: black; border: none; padding: 8px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">COMPRAR</button>
        <button onclick="executeTrade('SELL')" style="background: #FF5555; color: white; border: none; padding: 8px 20px; cursor: pointer; font-weight: bold; border-radius: 4px;">VENDER</button>
    </div>

    <!-- Historial de Operaciones -->
    <div style="max-height: 200px; overflow-y: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85em;">
            <thead>
                <tr style="border-bottom: 1px solid #58C4DD; color: #58C4DD;">
                    <th style="text-align: left; padding: 5px;">Tipo</th>
                    <th style="text-align: right; padding: 5px;">Precio BTC</th>
                    <th style="text-align: right; padding: 5px;">Operación</th>
                    <th style="text-align: right; padding: 5px;">Comisión</th>
                </tr>
            </thead>
            <tbody id="trade-history"></tbody>
        </table>
    </div>
</div>

<script>
    let account = {
        initial: 25000,
        cash: 25000,
        btcQty: 0,
        totalFees: 0,
        realizedPnL: 0
    };

    const FEE_RATE = 0.001; // 0.1%
    const USD_MXN = 17.50; 

    async function getPrice() {
        const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT`);
        const data = await response.json();
        return parseFloat(data.price) * USD_MXN;
    }

    async function executeTrade(type) {
        const amountMXN = parseFloat(document.getElementById('trade-amount').value);
        const currentPrice = await getPrice();
        
        if (isNaN(amountMXN) || amountMXN <= 0) return alert("Monto no válido");

        if (type === 'BUY') {
            const fee = amountMXN * FEE_RATE;
            if (amountMXN + fee > account.cash) return alert("Saldo insuficiente");
            
            account.cash -= (amountMXN + fee);
            account.totalFees += fee;
            account.btcQty += (amountMXN / currentPrice);
            updateUI('BUY', currentPrice, amountMXN, fee);
        } else {
            if (account.btcQty <= 0) return alert("No tienes BTC para vender");
            
            const grossValue = account.btcQty * currentPrice;
            const fee = grossValue * FEE_RATE;
            const netValue = grossValue - fee;
            
            account.cash += netValue;
            account.totalFees += fee;
            account.btcQty = 0; // Venta total
            
            // Cálculo de P&L Realizado comparando con el balance inicial
            // (Efectivo Actual + Valor Invertido) - Balance Inicial
            account.realizedPnL = (account.cash + (account.btcQty * currentPrice)) - account.initial;
            
            updateUI('SELL', currentPrice, grossValue, fee);
        }
    }

    function updateUI(type, price, mxn, fee) {
        // Inyectar fila en historial
        const row = `<tr style="border-bottom: 1px solid #333;">
            <td style="color: ${type === 'BUY' ? '#50FA7B' : '#FF5555'}; padding: 5px;">${type}</td>
            <td style="text-align: right; padding: 5px;">$${price.toLocaleString()}</td>
            <td style="text-align: right; padding: 5px;">$${mxn.toLocaleString()}</td>
            <td style="text-align: right; padding: 5px;">$${fee.toFixed(2)}</td>
        </tr>`;
        document.getElementById('trade-history').insertAdjacentHTML('afterbegin', row);

        // Actualizar indicadores globales
        document.getElementById('balance-mxn').innerText = `$${account.cash.toLocaleString()}`;
        document.getElementById('fees-mxn').innerText = `$${account.totalFees.toLocaleString()}`;
        
        const investedVal = account.btcQty * price;
        document.getElementById('invested-mxn').innerText = `$${investedVal.toLocaleString()}`;
        
        // P&L dinámico: Balance total actual vs Inicial
        const currentPnL = (account.cash + investedVal) - account.initial;
        const pnlElement = document.getElementById('total-pnl');
        pnlElement.innerText = `$${currentPnL.toLocaleString()}`;
        pnlElement.style.color = currentPnL >= 0 ? "#50FA7B" : "#FF5555";
    }
</script>
