<div id="chart-container" style="width: 100%; height: 400px; background-color: #1a1a1a; border-radius: 8px; border: 1px solid #58C4DD; overflow: hidden; position: relative;">
    <div id="crypto-chart" style="width: 100%; height: 100%;"></div>
    <div id="loading-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #58C4DD; font-family: sans-serif; z-index: 10;">
        Conectando con Binance API...
    </div>
</div>

<!-- Carga de la librería v4+ -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const chartElement = document.getElementById('crypto-chart');
        const overlay = document.getElementById('loading-overlay');
        
        // 1. Inicializar la Gráfica
        const chart = LightweightCharts.createChart(chartElement, {
            layout: {
                background: { color: '#1a1a1a' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2b2b2b' },
                horzLines: { color: '#2b2b2b' },
            },
            width: chartElement.offsetWidth,
            height: 400,
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // 2. CORRECCIÓN DEL ERROR: Usar addSeries con el constructor de la serie
        // Usamos tu azul Manim (#58C4DD) para las velas alcistas
        const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#58C4DD', 
            downColor: '#FF5555',
            borderVisible: false,
            wickUpColor: '#58C4DD',
            wickDownColor: '#FF5555',
        });

        // 3. Obtener Datos Históricos (Binance no tiene problemas de CORS)
        async function fetchMarketData() {
            const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=100`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const formattedData = data.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));

                candleSeries.setData(formattedData);
                overlay.style.display = 'none'; 
            } catch (e) {
                console.error("Error en el fetch:", e);
                overlay.innerText = "Error de conexión con el mercado.";
            }
        }

        // 4. Actualización en Tiempo Real (Polling)
        function startRealTime() {
            setInterval(async () => {
                try {
                    const response = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT`);
                    const data = await response.json();
                    const price = parseFloat(data.price);
                    
                    candleSeries.update({
                        time: Math.floor(Date.now() / 1000),
                        open: price, // Simplificado para el update de la vela actual
                        high: price,
                        low: price,
                        close: price,
                    });
                } catch (e) { console.warn("Esperando actualización..."); }
            }, 20000); // Cada 20 segundos
        }

        fetchMarketData();
        startRealTime();

        // Responsive resize
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.offsetWidth });
        });
    });
</script>
