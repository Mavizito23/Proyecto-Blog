<!-- Contenedor de la gráfica -->
<div id="chart-container" style="width: 100%; height: 400px; background-color: #1a1a1a; border-radius: 8px; border: 1px solid #333; overflow: hidden;">
    <div id="aapl-chart" style="width: 100%; height: 100%;"></div>
</div>

<!-- Carga de la librería desde CDN -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
    const chartElement = document.getElementById('aapl-chart');
    
    // 1. Configuración de la Gráfica con tus colores Manim
    const chart = LightweightCharts.createChart(chartElement, {
        layout: {
            backgroundColor: '#1a1a1a',
            textColor: '#d1d4dc',
        },
        grid: {
            vertLines: { color: '#2b2b2b' },
            horzLines: { color: '#2b2b2b' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        timeScale: { timeVisible: true, secondsVisible: false },
    });

    const candleSeries = chart.addCandlestickSeries({
        upColor: '#50FA7B',    // Verde (éxito)
        downColor: '#FF5555',  // Rojo (fracaso)
        borderDownColor: '#FF5555',
        borderUpColor: '#50FA7B',
        wickDownColor: '#FF5555',
        wickUpColor: '#50FA7B',
    });

    // 2. Función para obtener datos históricos (24h)
    // Usaremos Alpha Vantage o una API similar (necesitarás tu API Key)
    async function fetchHistoricalData() {
        const symbol = "AAPL";
        const apiKey = "TU_API_KEY"; // Consigue una gratis en Alpha Vantage
        const url = `https://www.alphavantage.co/query?function=TIME_SERIES_INTRADAY&symbol=${symbol}&interval=1min&apikey=${apiKey}`;

        try {
            const response = await fetch(url);
            const data = await response.json();
            const timeSeries = data["Time Series (1min)"];
            
            // Transformar datos al formato de la librería
            const formattedData = Object.keys(timeSeries).map(time => {
                const d = timeSeries[time];
                return {
                    time: new Date(time).getTime() / 1000,
                    open: parseFloat(d["1. open"]),
                    high: parseFloat(d["2. high"]),
                    low: parseFloat(d["3. low"]),
                    close: parseFloat(d["4. close"]),
                };
            }).reverse();

            candleSeries.setData(formattedData);
        } catch (e) {
            console.error("Error cargando históricos:", e);
        }
    }

    // 3. Simulación de Tiempo Real (Cada 1 minuto)

            const apiKey = "TU_API_KEY";
            const url = `https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=AAPL&apikey=${apiKey}`;

                const quote = data["Global Quote"];

</script>
