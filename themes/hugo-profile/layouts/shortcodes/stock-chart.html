<div id="chart-container" style="width: 100%; height: 400px; background-color: #1a1a1a; border-radius: 8px; border: 1px solid #58C4DD; overflow: hidden; position: relative;">
    <div id="aapl-chart" style="width: 100%; height: 100%;"></div>
    <div id="loading-overlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a1a; display: flex; align-items: center; justify-content: center; color: #58C4DD; font-family: sans-serif; z-index: 10;">
        Cargando datos de mercado...
    </div>
</div>

<!-- Librería de TradingView (Lightweight Charts) -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const chartElement = document.getElementById('aapl-chart');
        const overlay = document.getElementById('loading-overlay');
        
        // 1. Crear la Gráfica con tus colores de Manim
        const chart = LightweightCharts.createChart(chartElement, {
            layout: {
                background: { color: '#1a1a1a' },
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2b2b2b' },
                horzLines: { color: '#2b2b2b' },
            },
            width: chartElement.offsetWidth,
            height: 400,
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // 2. Nueva sintaxis: addSeries con tipo 'Candlestick'
        const candleSeries = chart.addSeries(LightweightCharts.CandlestickSeries, {
            upColor: '#58C4DD',    // Tu azul Manim para velas alcistas
            downColor: '#FF5555',  // Rojo para bajistas
            borderVisible: false,
            wickUpColor: '#58C4DD',
            wickDownColor: '#FF5555',
        });

        // 3. Función para obtener datos (Usando Binance para evitar bloqueos de API Key)
        async function fetchMarketData() {
            // Usamos BTCUSDT para asegurar que siempre haya datos activos
            const url = `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=100`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                const formattedData = data.map(d => ({
                    time: d[0] / 1000,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));

                candleSeries.setData(formattedData);
                overlay.style.display = 'none'; // Quitar el texto de carga
            } catch (e) {
                console.error("Error cargando datos:", e);
                overlay.innerText = "Error al conectar con el mercado.";
            }
        }

        // 4. Simulación de Tiempo Real (Polling cada 30 segundos)
        function startRealTime() {
            setInterval(async () => {
                const url = `https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT`;
                try {
                    const response = await fetch(url);
                    const data = await response.json();
                    const price = parseFloat(data.price);
                    
                    // Actualizar la última vela
                    candleSeries.update({
                        time: Math.floor(Date.now() / 1000),
                        value: price // La librería maneja el cierre automáticamente si es update
                    });
                } catch (e) { console.log("Reintentando conexión..."); }
            }, 30000);
        }

        // Ejecutar
        fetchMarketData();
        startRealTime();

        // Ajustar tamaño si la ventana cambia
        window.addEventListener('resize', () => {
            chart.applyOptions({ width: chartElement.offsetWidth });
        });
    });
</script>
